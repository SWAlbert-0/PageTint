<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>测试课程：梯度下降</title>
<style>body{max-width:760px;margin:60px auto;padding:0 24px;font:18px/1.9 sans-serif;color:#203346}button{padding:8px;margin:5px}</style>
<h1>测试课程：梯度下降</h1><p>选中文字后添加批注。刷新页面、关闭并重开浏览器，检查是否恢复。</p>
<div id="article"><p id="target">梯度下降通过<b>不断调整参数</b>，让损失函数逐步减小。学习率决定每次更新的步长。</p>
<p>跨节点选文测试：这一段包含<strong>已有加粗</strong>以及<a href="#practice">练习链接</a>，批注应覆盖整个选区。</p>
<p>第一种情况：重复句子。这里的前后文用于区分位置。</p><p>第二种情况：重复句子。重复文本不应被随意匹配。</p>
<h2 id="practice">练习</h2><p>请用自己的话解释为什么学习率过大会导致无法收敛。</p></div>
<button onclick="document.getElementById('article').prepend(Object.assign(document.createElement('p'),{textContent:'动态插入的新段落，用于测试位置变化。'}))">前面插入段落</button>
<button onclick="document.getElementById('target')?.remove()">删除第一段原文</button>
</html>
