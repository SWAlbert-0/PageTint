<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PageTint · 页彩 · 数据管理</title>
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand"><img src="icons/icon.svg" alt="" width="38" height="38"><div class="brand-name">PageTint<span>页彩</span></div></div>
    <span class="local-badge">本机保存</span>
  </header>
  <main>
    <section class="activation-panel" aria-label="启用设置">
      <div class="activation-heading"><label for="enabled-toggle">启用 PageTint</label><input id="enabled-toggle" type="checkbox" role="switch" checked disabled></div>
      <div class="site-setting"><label for="site-mode" id="site-host">当前网站</label><select id="site-mode" disabled><option value="auto">自动识别文章页</option><option value="on">始终启用</option><option value="off">始终停用</option></select></div>
      <p id="activation-status" role="status" aria-live="polite">正在读取启用状态…</p>
    </section>
    <section class="export-panel" aria-labelledby="export-title">
      <div class="export-heading"><span class="file-tag" aria-hidden="true">.md</span><div><h1 id="export-title">导出当前文章</h1><p>完整正文，保留编辑样式、批注与 TeX</p></div></div>
      <button id="export-markdown" class="button button-primary"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>导出当前页 Markdown</button>
      <p class="export-help">请先打开原文并加载正文 · 图片保留在线链接</p>
    </section>
    <section class="saved-pages" aria-labelledby="pages-title">
      <div class="section-heading"><h2 id="pages-title">页面数据</h2><p id="summary" aria-live="polite"></p></div>
      <div id="pages" aria-label="已保存的页面"></div>
      <p class="delete-help" id="delete-help">删除会清除该页全部编辑，无法撤销。</p>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <footer>
    <a class="backup-link" href="migration.html" target="_blank" rel="noopener" aria-label="打开设置"><span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M6 14v6"/></svg>设置</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></a>
    <p class="shortcuts"><span><kbd data-shortcut-label="bold">Ctrl+B</kbd> 加粗</span><span><kbd data-shortcut-label="highlight">Ctrl+Q</kbd> 高亮</span><span><kbd data-shortcut-label="fontColor">Alt+C</kbd> 文字色</span><span><kbd data-shortcut-label="undo">Ctrl+Z</kbd> 撤销</span></p>
  </footer>
  <script src="core.js"></script><script src="activation.js"></script><script src="popup.js"></script>
</body>
</html>
